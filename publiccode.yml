description:
  it:
    shortDescription: "EduWISP — Family Control"
    longDescription: "Verifica della relazione genitore/tutore-studente, deleghe e regole familiari aggiuntive coordinate con quelle scolastiche. Fa parte di EduWISP, piattaforma open source e gratuita per la gestione dei dispositivi digitali di proprietà delle scuole, con MDM, gestione scolastica, Family Control e prevenzione del cyberbullismo. Il progetto è in fase di progettazione e rispetta come vincolo bloccante il GDPR e la normativa italiana su privacy e minori. Documentazione: https://eduwisp.github.io/docs/"
    documentation: "https://eduwisp.github.io/docs/"
    features:
      - "Family Control"
  en:
    shortDescription: "EduWISP — Family Control"
    longDescription: "Parent/guardian-student relationship verification, delegations and additional family rules coordinated with school rules. Part of EduWISP, a free and open-source platform to manage school-owned digital devices, with MDM, school management, family control and cyberbullying prevention. The project is in the design phase and treats GDPR and Italian law on privacy and minors as a blocking constraint. Documentation: https://eduwisp.github.io/docs/en/"
    documentation: "https://eduwisp.github.io/docs/en/"
    features:
      - "Family Control"

